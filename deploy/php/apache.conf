# Integral del Este — Apache dentro del contenedor "app". Caddy termina TLS y pasa los pedidos acá.
<VirtualHost *:80>
    ServerName integral
    DocumentRoot /var/www/integral/public

    # La IP real del usuario viene de Caddy (límite de intentos de ingreso por IP).
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16

    <Directory /var/www/integral/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <FilesMatch "\.(css|js|svg|png)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>

    # Las variables del contenedor (DB_*, ARCA_*, …) llegan a PHP por el entorno del proceso (getenv).

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
