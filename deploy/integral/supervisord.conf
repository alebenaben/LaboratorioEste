; Integral del Este — procesos del contenedor "todo en uno".
; Los arranca deploy/integral/entrypoint.sh, que antes prepara el entorno y las migraciones.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Apache con PHP (la aplicación web). Para él no hay reintentos limitados.
[program:web]
command=apache2-foreground
autorestart=true
startretries=100
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Worker: pide los CAE a ARCA y envía los mails. Termina la tarea en curso al recibir TERM.
[program:worker]
command=php bin/worker.php
directory=%(ENV_APP_DIR)s
user=www-data
autorestart=true
startsecs=5
startretries=100
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Copias de seguridad cada 6 horas (restic). Solo si están los datos del bucket.
[program:copias]
command=/loop.sh
autostart=%(ENV_COPIAS_ACTIVAS)s
autorestart=true
startretries=100
environment=DB_USER="integral_backup",DB_PASSWORD="%(ENV_DB_BACKUP_PASSWORD)s"
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
