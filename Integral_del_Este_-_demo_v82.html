.pdf-ico{width:44px;height:54px;border-radius:6px;background:#c23b3f;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
input.falta{border-color:var(--bad)!important;outline:2px solid var(--bad);outline-offset:-1px;background:var(--bad-soft)}
.ret-paso{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.ret-paso.act{border:2px solid var(--accent);background:var(--accent-soft)}.ret-paso.hecho{background:var(--sunken)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:9px 16px;font:inherit;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.at-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.at-grid{grid-template-columns:1fr}}
.at-paso{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.at-envio{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.at-envio label.f{flex:1 1 220px;margin:0}
.btn.btn-wa{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:600}
.btn.btn-wa:hover{filter:brightness(1.06)}
.btn-wa svg{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.plan-card[data-act]{cursor:pointer}
.nav-badge{margin-left:auto;background:var(--logo-red);color:#fff;border-radius:999px;font-size:12px;font-weight:700;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 6px}
.alerta-aud{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:2px solid var(--logo-red);background:color-mix(in srgb,var(--logo-red) 10%,var(--surface));color:var(--logo-red);border-radius:12px;padding:12px 16px;font-weight:600}
.alerta-aud .btn{background:var(--logo-red);border-color:var(--logo-red);color:#fff}
.aud-card{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.linklike{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:12.5px;text-align:left}
.linklike:hover{color:var(--ink)}
.admin-pill{display:flex;align-items:center;gap:8px;font-size:13px}
.admin-pill svg{width:16px;height:16px;flex:none}
.overlay.center{justify-content:center;align-items:center;padding:16px}
#layer2 .overlay{z-index:55}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(440px,100%);max-height:calc(100vh - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:19px;font-weight:650}
.modal p{margin:0;color:var(--muted)}
.lockhint{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
input.monto{text-align:right;font-variant-numeric:tabular-nums}
input[readonly]{background:var(--sunken);color:var(--muted)}
kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.vlist{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.vlist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.vlist b{font-variant-numeric:tabular-nums}
.vlist span{color:var(--muted);font-size:14px}
@media print{body>*:not(#layer2){display:none!important}#layer2 .overlay{position:static;background:none;padding:0}#layer2 .modal{border:0;width:100%;max-height:none}.noprint{display:none!important}}
.comp{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.comp table td,.comp table th{padding:6px 8px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);gap:12px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand>span,.side-foot{display:none}
  .brand b{font-size:18px;white-space:nowrap}
  .logo svg{width:24px;height:25px}
  .logo .wm{font-size:13px;white-space:nowrap}
  nav{flex-direction:row;overflow-x:auto;min-width:0}
  nav a svg{display:none}
  nav a[aria-current="page"]::before{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .fam-row{grid-template-columns:1fr 1fr}
  .bar{grid-template-columns:90px minmax(0,1fr) 80px}
  .kv{grid-template-columns:110px minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .2s ease-out} @keyframes up{from{transform:translate(-50%,8px)}} }

<script>
/* ---------- versión: subir en cada modificación ---------- */
const VERSIONES=[
 {v:82,fecha:'2026-10-28',t:'Nuevo acceso “Quiere darse de baja” para los usuarios: buscan al afiliado y ven todo (antigüedad, cuota, ahorro, lo que usó y lo que tiene sin usar, grupo, cumpleaños, pedidos anteriores). Eligen el motivo y el sistema les dice qué decirle y qué ofrecer, de a una. Los descuentos y cambios de plan los decide administración; las bajas las confirma el administrador desde Estadísticas.'},
 {v:81,fecha:'2026-10-28',t:'Nueva sección Promociones (solo administrador): se arma la promoción (título, beneficio, unidad, fechas, a qué planes), se ve el PDF y se manda a todos los afiliados por mail juntos o por WhatsApp de a uno, con el PDF personalizado. Se lleva la cuenta de a quién ya le llegó. La unidad ve la promoción vigente al verificar al afiliado.'},
 {v:80,fecha:'2026-10-28',t:'Beneficios: el cuadro de consultas se simplificó a “Enviar información a una persona”: se elige si es un afiliado o un interesado, se completa quién es y el celular, y se manda un PDF prolijo por WhatsApp. Se sacaron el canal, el texto editable y los botones de copiar e imprimir. En todo el sistema ya no se manda texto suelto: cotizaciones, beneficios, resúmenes, ahorro y saludos de cumpleaños salen siempre en PDF.'},
 {v:79,fecha:'2026-10-28',t:'Fecha de nacimiento en el alta (titular y familiares) y en la ficha, con la edad. Aviso de cumpleaños del día con saludo por WhatsApp. Retención de bajas: antes de dar de baja se registra el motivo, se le recuerda al afiliado lo que ya obtuvo y se le ofrecen propuestas de a una, de menor a mayor (no se ofrece lo mejor de entrada); cada paso queda registrado y en Estadísticas se ve cuántos se retuvieron y con qué.'},
 {v:78,fecha:'2026-10-28',t:'El usuario CMDE pasa a ser un usuario de atención: ve Altas, Cotizador, Autorizaciones y Beneficios, y desde Autorizaciones emite las órdenes para Biobárica, Óptica y demás (que descuentan el beneficio). Nuevo: Resumen mensual de beneficios para los afiliados: al terminar el mes, a cada afiliado que usó algún beneficio se le manda por mail (a todos de una vez) o por WhatsApp (con PDF) el detalle de lo que usó y cuánto ahorró. Aviso a los administradores cuando hay un resumen para enviar.'},
 {v:77,fecha:'2026-10-28',t:'Cotizador: para enviar la cotización hay que completar el apellido o nombre del interesado y un celular válido (10 números con característica). Si falta algo, el casillero se marca en rojo y se explica qué falta.'},
 {v:76,fecha:'2026-10-28',t:'Cotizador: el interesado se escribe como “Apellido y nombre” y queda en mayúsculas. El sistema reconoce solo cuál es el apellido y cuáles los nombres (aunque se escriban al revés) y saluda por el primer nombre.'},
 {v:75,fecha:'2026-10-28',t:'Cotizador: casilleros para el nombre y el celular del interesado. Con el celular cargado, “Enviar cotización en PDF” va directo a su WhatsApp y el mensaje lo saluda por su nombre. Cada cotización enviada queda registrada como consulta.'},
 {v:74,fecha:'2026-10-28',t:'Enviar por WhatsApp desde el Cotizador, Beneficios o la ficha: ahora lo principal es el PDF prolijo (botón grande “Compartir PDF por WhatsApp”) con un mensaje corto que lo acompaña. Mandar solo el texto queda como opción secundaria.'},
 {v:73,fecha:'2026-10-28',t:'Mejoras sugeridas por administración: 1) Mail: el email del titular es obligatorio en el alta (salvo que no tenga), las facturas del mes se envían por mail a todos de una vez con un texto que se arma en Configuración, y recibos y facturas tienen botón Enviar por mail. 2) Promoción en la cuota: se puede renovar, extender o quitar desde la ficha del afiliado. 3) Débito automático uno por uno, con la fecha en que entró cada pago (Mercado Pago cobra en fechas distintas). 4) Autorizaciones: al emitir una autorización se descuenta el beneficio (sesiones sin cargo, cupos), igual que cuando lo registra la unidad, sin contarlo dos veces.'},
 {v:72,fecha:'2026-10-28',t:'Las facturas y los recibos que recibe el afiliado (en pantalla, impresos o en PDF) ya no dicen quién cobró ni quién emitió. Ese dato queda solo para uso interno (listas de Caja e historial).'},
 {v:71,fecha:'2026-10-28',t:'PDF prolijos para mandar a las personas: información de un plan, cotización (integrantes, cuota, promoción y beneficios), situación del afiliado (lo que tiene disponible, lo que usó y cuánto ahorró) y la consulta armada en Beneficios. En cada envío por WhatsApp aparecen los botones Descargar PDF y Compartir PDF. Lo puede usar cualquier usuario.'},
 {v:70,fecha:'2026-10-28',t:'Recibos y facturas de cuota en PDF prolijo, con el logo y los datos de Grupo del Este Salud S.A.S.: botón Descargar PDF y botón Compartir PDF (en el celular abre directamente WhatsApp, mail u otras apps con el PDF adjunto; en la computadora lo descarga y abre WhatsApp para adjuntarlo).'},
 {v:69,fecha:'2026-10-28',t:'Ingreso: mensajes más claros (usuario inexistente, clave incorrecta o usuario dado de baja) y, solo en la demo, un enlace para volver las claves de todos los usuarios a su nombre si alguien no puede entrar. El teclado del celular ya no cambia mayúsculas en el usuario.'},
 {v:68,fecha:'2026-10-28',t:'Recibos de cobro: al tocar Cobrar se abre el recibo listo para imprimir o mandar por WhatsApp (con el importe en letras, la factura que cancela y el medio de pago). En Caja hay una lista de recibos emitidos y en la cuenta corriente cada recibo tiene su botón Ver.'},
 {v:67,fecha:'2026-10-28',t:'Salir más visible: botón “Salir” con ícono, pegado al nombre, arriba a la derecha en todas las pantallas (administradores, usuarios y unidades). También en el recuadro del usuario del menú.'},
 {v:66,fecha:'2026-10-28',t:'Configuración → Copias de seguridad: un administrador descarga una copia completa de los datos (afiliados, cuotas, facturas, usos, egresos, usuarios y configuración) y la puede restaurar con su clave. Muestra cuándo se hizo la última copia y avisa en rojo si pasaron más de 7 días. En el servidor las copias van a ser automáticas.'},
 {v:65,fecha:'2026-10-28',t:'Se eliminó la unidad de prueba Kinesiología, con su usuario, sus prestaciones y sus usos de prueba.'},
 {v:64,fecha:'2026-10-28',t:'Unidades dadas de baja: desaparecen de la lista de unidades y quedan en un apartado aparte (“Ver unidades dadas de baja”). Al abrir una dada de baja solo se puede volver a activarla o eliminarla (si nunca registró usos); ya no ofrece cambiar usuario ni clave.'},
 {v:63,fecha:'2026-10-28',t:'Ingreso: la lista de usuarios ya no muestra a todos. Cada computadora recuerda solo los usuarios que entraron desde ella (el último primero) y se pueden olvidar con la ×. Quien entra por primera vez escribe su usuario.'},
 {v:62,fecha:'2026-10-28',t:'Unidades de negocio editables: botón Editar en cada unidad para cambiar el nombre (las creadas por ustedes), el texto del beneficio, la carencia, el usuario y la clave. Se puede dar de baja una unidad (deja de poder entrar y verificar, pero su historial queda) y volver a activarla, o eliminarla si nunca registró usos. Todo se confirma con la clave del administrador.'},
 {v:61,fecha:'2026-10-28',t:'Configuración más segura: antes de guardar cualquier cambio (precios, descuentos, sesiones sin cargo, carencias, permisos, puntos de venta, prestaciones) el sistema muestra la lista exacta de lo que va a cambiar, antes y después, marca en rojo los cambios fuera de lo común y pide la clave del administrador para confirmar. Los campos modificados se marcan en amarillo mientras se editan. Cada cambio se puede deshacer desde Configuración → Últimos cambios.'},
 {v:60,fecha:'2026-10-28',t:'Nueva sección Informes (administradores): se elige el informe (movimientos de caja, facturación de cuotas, egresos, libro diario, usos de beneficios, altas y bajas, padrón o resumen estadístico), el período (este mes, mes anterior, un mes puntual, este año, año anterior o entre dos fechas) y se descarga en Excel o PDF. Antes de descargar se ve una vista previa.'},
 {v:59,fecha:'2026-10-28',t:'Nueva sección Egresos (administradores): se cargan los gastos de Integral del Este (alquiler, sueldos, insumos, servicios, honorarios, sepelio, ayudas a afiliados, publicidad, comisiones, impuestos, etc.) con proveedor, comprobante, IVA y medio de pago. Gastos fijos que se repiten cada mes con un clic. Resumen del mes: ingresos cobrados, egresos por categoría y resultado. Cada egreso genera su asiento en Contabilidad.'},
 {v:58,fecha:'2026-10-28',t:'Estadísticas → Consumo de beneficios: qué usan los afiliados en cada unidad y comercio (usos, sin cargo, con descuento, afiliados distintos y ahorro), por plan, lo más usado y los beneficios que nadie usó en el período. Incluye los consumos cargados por cualquier usuario de unidad o comercio. Botón para ver cada uso en detalle.'},
 {v:57,fecha:'2026-10-28',t:'Ahorro de los afiliados: en Estadísticas se ve cuánto ahorraron los afiliados por usar sus beneficios (este mes, últimos 3 meses o este año), por unidad y por grupo, comparado con lo que pagaron de cuota, con un botón para mandarle a cada titular su resumen de ahorro por WhatsApp. La unidad ve cuánto lleva ahorrado el afiliado en el año, y la ficha del afiliado también. Si la unidad no carga el precio, se usa el valor de referencia del nomenclador.'},
 {v:56,fecha:'2026-10-28',t:'Configuración → Unidades de negocio: se puede crear una unidad nueva con su nombre, el servicio que presta, el descuento para cada plan, la carencia y, si corresponde, prestaciones sin cargo. Se crea sola con su usuario (clave igual al nombre) y funciona igual que Biobárica, Laboratorio u Óptica. También se ve el resumen de todas las unidades.'},
 {v:55,fecha:'2026-10-28',t:'Unidades de negocio: el afiliado se puede buscar también por nombre, apellido o CUIT, con sugerencias desde la primera letra. El DNI sigue con separador de miles.'},
 {v:54,fecha:'2026-10-28',t:'Usuarios de unidades bien escritos: Biobárica, Laboratorio, Óptica y CMDE. Se puede entrar escribiéndolos con o sin tilde y mayúsculas; la clave sigue siendo el mismo nombre.'},
 {v:53,fecha:'2026-10-28',t:'Unidades de negocio: apenas se escribe el DNI aparece el afiliado y, destacado, de qué beneficio dispone hoy en esa unidad según su plan (sin cargo con cuántas le quedan, o el % de descuento), cuándo mejora el descuento si es escalonado y el beneficio completo de su plan.'},
 {v:52,fecha:'2026-10-28',t:'Verificar afiliado (unidades y comercios): el DNI se escribe con separador de miles y Esc borra todo para verificar a otro afiliado.'},
 {v:51,fecha:'2026-10-28',t:'Ingreso: la lista de usuarios muestra también las unidades de negocio (Biobárica, Laboratorio, Óptica, CMDE), marcadas como unidad. Los comercios adheridos siguen sin aparecer en la lista: escriben su usuario.'},
 {v:50,fecha:'2026-10-28',t:'Laboratorio pasa a ser unidad de negocio, como la Biobárica y la Óptica: verifica al afiliado y registra los usos (análisis de laboratorio con hasta 30% de reintegro, carencia de 6 meses, en los planes Integral y Plus). Usuarios de unidad: biobarica, laboratorio y optica (clave igual al nombre).'},
 {v:49,fecha:'2026-10-28',t:'Integral del Este solo factura las cuotas de sus afiliados. Las prestaciones las cobra cada unidad con su propio sistema: la sección Prestaciones pasa a ser Usos en unidades, solo para administradores, con lo que registraron la Biobárica, la Óptica y el CMDE (sin cargo, descuentos y ahorro). Los usuarios ya no ven Prestaciones. En Configuración, las prestaciones quedan con su valor de referencia (sin IVA ni facturación) y el punto de venta es solo el de las cuotas.'},
 {v:48,fecha:'2026-10-28',t:'Usuarios para las unidades de negocio (Biobárica, Óptica y CMDE): con el DNI o el N° de afiliado ven si está vigente y qué le corresponde hoy en cada prestación (sin cargo con cuántas le quedan, o el % de descuento), y registran el uso. El registro queda en el historial del afiliado en Integral y descuenta del cupo: la próxima vez el sistema ya sabe cuántas usó. La unidad cobra con su propio sistema.'},
 {v:47,fecha:'2026-10-28',t:'Importar precios desde Excel: si el archivo tiene una hoja llamada Nomenclador (o Precios / Lista), se lee solo esa y se ignoran las hojas de instrucciones. Pensado para el nomenclador de prestaciones que completa cada unidad.'},
 {v:46,fecha:'2026-10-28',t:'IVA según el contador: cuotas de los planes (prepaga, afiliados voluntarios) gravadas al 10,5%; prestaciones a pacientes particulares al 21%. Obras sociales sindicales, prepagas por afiliados obligatorios y hospitales públicos, exentos. Factura A solo a Responsables Inscriptos; Factura B a consumidores finales y exentos. La tabla queda en Configuración → Tratamiento de IVA.'},
 {v:45,fecha:'2026-10-28',t:'IVA: cada plan y cada prestación tiene su alícuota (21%, 10,5%, exento o a confirmar). Factura A para quien paga como Responsable Inscripto, con neto e IVA discriminado; Factura B con la leyenda del Régimen de Transparencia Fiscal al Consumidor (Ley 27.743) y el IVA contenido. Los datos fiscales de quien paga (condición frente al IVA, CUIT y razón social) se cargan en la ficha del titular. Factura A y B llevan numeración separada.'},
 {v:44,fecha:'2026-10-28',t:'Puntos de venta independientes: cuotas de Integral, CMDE, Óptica y Biobárica tienen cada uno su punto de venta y su numeración de facturas (formato 00001-00000001). Se configuran en Configuración → Puntos de venta, con el último número emitido para seguir la numeración.'},
 {v:43,fecha:'2026-10-28',t:'Facturas y recibos con los datos fiscales reales de Grupo del Este Salud S.A.S.: CUIT 30-71644749-5, IVA Responsable Inscripto, Ingresos Brutos ATER contribuyente directo, inicio de actividades 05/2019 y domicilio Gral. José Gervasio Artigas 371, Colonia Avellaneda (CP 3107), Entre Ríos. Encabezado con la letra del comprobante (B o X) y receptor Consumidor Final.'},
 {v:42,fecha:'2026-10-27',t:'Configuración → Prestaciones: cada precio muestra la fecha de su última actualización y quién la hizo, y arriba se ve la fecha de la última actualización de la lista. Se registra al guardar a mano y al importar desde PDF o Excel.'},
 {v:41,fecha:'2026-10-27',t:'Actualizar prestaciones desde un archivo: en Configuración → Prestaciones se sube el PDF (o Excel) con la lista de precios. El sistema lee cada renglón, lo relaciona con la prestación que ya existe y muestra una vista previa con precio actual y nuevo, prestaciones nuevas para agregar y las que no figuran en la lista para quitar. Se puede corregir todo antes de aplicar y queda registrado en el historial.'},
 {v:40,fecha:'2026-10-27',t:'Prestaciones: el total con los botones (factura, recibo, guardar) queda arriba a la derecha, justo debajo de la prestación elegida, más compacto y con borde azul. Se ve apenas se elige el afiliado y la prestación, sin bajar la pantalla.'},
 {v:39,fecha:'2026-10-27',t:'Prestaciones: en todas se puede elegir Factura o Recibo. Con Recibo (no se factura) se puede aplicar un descuento adicional en porcentaje, que se suma al beneficio del plan y se ve en el recibo. Si lo aplica un usuario, lo tiene que autorizar un administrador (se puede cambiar en Configuración → Permisos).'},
 {v:38,fecha:'2026-10-27',t:'Prestaciones sin cargo: si el afiliado no tiene que pagar nada no se hace factura. Se ve el cartel Sin cargo, sin medio de pago, y se elige Guardar (queda registrado el uso) o Guardar e imprimir recibo. El comprobante se llama Recibo sin cargo y no lleva CAE.'},
 {v:37,fecha:'2026-10-27',t:'Prestaciones: cuando la prestación entra en lo sin cargo del plan ya no aparece el casillero de descuento; el descuento solo se muestra para las que se cobran (la segunda en adelante). Tampoco aparece si el afiliado no está al día o ya llegó al tope. La línea sin cargo se marca en verde y la factura no le suma descuento a lo que fue gratis.'},
 {v:36,fecha:'2026-10-27',t:'Beneficios: nuevo panel Atender una consulta para quien llama, escribe o viene en persona. Se elige el canal, si es afiliado (se envía su situación y lo que le queda) o qué planes le interesan, y al final se pone el teléfono y se envía por WhatsApp. También se puede imprimir o copiar. Cada consulta queda registrada y se ve en Estadísticas. Desde acá solo se informa: las decisiones quedan en administración.'},

function puntaje(label,q){const L=norm(label),toks=norm(q).split(/\s+/).filter(Boolean);if(!toks.length)return 0;const ws=L.split(/[\s\/·,.-]+/);
  if(L.startsWith(norm(q).trim()))return 0;if(toks.every(t=>ws.some(w=>w.startsWith(t))))return 1;if(norm(q).replace(/\s/g,'').length>=3&&toks.every(t=>L.includes(t)))return 2;return -1}

function conSugerencias(inp,{fuente,elegir,vacio=false}){if(!inp||inp.dataset.ac)return;inp.dataset.ac=1;
  const w=document.createElement('span');w.className='ac';inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
  const ul=document.createElement('ul');ul.setAttribute('role','listbox');ul.hidden=true;w.appendChild(ul);
  inp.setAttribute('role','combobox');inp.setAttribute('aria-autocomplete','list');inp.setAttribute('autocomplete','off');let act=-1,items=[],silencio=false;
  const cerrar=()=>{ul.hidden=true;act=-1};
  const pintar=()=>{ul.querySelectorAll('li[data-i]').forEach((li,i)=>li.classList.toggle('act',i===act));ul.querySelector('.act')?.scrollIntoView({block:'nearest'})};
  const abrir=()=>{if(silencio||document.activeElement!==inp)return;items=fuente(inp.value);if(items===null){cerrar();return}act=items.length?0:-1;
    ul.innerHTML=items.map((x,i)=>`<li role="option" data-i="${i}">${esc(x.label)}${x.sub?`<small>${esc(x.sub)}</small>`:''}</li>`).join('')||'<li style="cursor:default;color:var(--muted)">Sin coincidencias</li>';ul.hidden=false;pintar()};
  const tomar=x=>{cerrar();silencio=true;try{elegir(x,inp)}finally{silencio=false}};
  inp.addEventListener('input',abrir);
  if(vacio)inp.addEventListener('focus',()=>{inp.select?.();abrir()});
  ul.addEventListener('mousedown',e=>{const li=e.target.closest('li[data-i]');if(li){e.preventDefault();tomar(items[+li.dataset.i])}});
  inp.addEventListener('keydown',e=>{if(ul.hidden){if(e.key==='ArrowDown'&&vacio){e.preventDefault();abrir()}return}
    if(e.key==='ArrowDown'){e.preventDefault();act=Math.min(items.length-1,act+1);pintar()}else if(e.key==='ArrowUp'){e.preventDefault();act=Math.max(0,act-1);pintar()}
    else if(e.key==='Enter'||e.key==='Tab'){if(items[act]){if(e.key==='Enter')e.preventDefault();tomar(items[act])}else cerrar()}

  inp.addEventListener('blur',()=>setTimeout(cerrar,120));
  return {cerrar}}

  return head('Afiliados',`${act.length} afiliados activos: ${planesVista().map(p=>[p,act.filter(a=>grupo(a.grupo).plan===p.id).length]).filter(x=>x[1]).map(([p,n])=>`${n} en el ${esc(p.nombre)}`).join(', ')}. Tocá una fila para ver o editar los datos.`,`<button class="btn primary" data-act="nueva-alta" type="button">Nueva alta</button>`)+
  `<div class="row"><input id="q" type="search" placeholder="Buscar por nombre, CUIT/DNI o N° de afiliado" value="${esc(ui.q)}" style="flex:1 1 260px">

   <div class="tbl-wrap"><table><thead><tr><th>N°</th><th>Nombre</th><th>CUIT/DNI</th><th>Categoría</th><th class="r">Cuota</th><th>Paga con</th><th>Alta</th><th>Cuenta</th></tr></thead><tbody id="tb-af"></tbody></table></div>`;

V.altas=()=>{if(!ui.alta)ui.alta=nuevaAlta();return vistaAlta()};
after.altas=()=>afterAlta();
after.afiliados=()=>{
  const fe=document.getElementById('festado');fe.value=ui.estado;
  const fill=()=>{
    const q=norm(ui.q),qd=docNorm(ui.q),toks=q.split(/\s+/).filter(Boolean);
    const rows=S.afiliados.filter(a=>(!ui.estado||a.estado===ui.estado)&&(!q||toks.every(t=>norm(a.nombre+' '+a.nro).includes(t))||(qd.length>=4&&docNorm(a.doc).includes(qd))))
      .sort((a,b)=>a.nro-b.nro);
    document.getElementById('tb-af').innerHTML=rows.map(a=>{const g=grupo(a.grupo),t=titular(g);return `<tr data-open="${a.id}" tabindex="0">
      <td class="mono">${a.nro}</td><td><b>${esc(a.nombre)}</b>${t.id!==a.id?`<div class="muted" style="font-size:13px">Paga: ${esc(t.nombre)}</div>`:''}</td><td class="num">${esc(a.doc)}</td>
      <td class="nw">${esc(cat(a.categoria).nombre)}<div class="muted" style="font-size:13px">${planCorto(g.plan)}</div></td><td class="r num">${money(a.cuota)}</td><td class="nw">${esc(g.formaPago.replace(' bancaria',''))}</td><td class="num">${fd(a.fechaAlta)}</td><td>${a.estado==='activo'?chipCuenta(g.id):chipEstado(a)}</td></tr>`}).join('')||`<tr><td colspan="8" class="muted">No hay afiliados que coincidan.</td></tr>`;
  };
  fill();
  document.getElementById('q').oninput=e=>{ui.q=e.target.value;fill()};
  fe.onchange=e=>{ui.estado=e.target.value;fill()};
};

    <div id="fams" style="display:flex;flex-direction:column;gap:10px">${a.familia.map((f,i)=>`<div class="fam-row" data-i="${i}" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) auto">
      <label class="f">Apellido<input data-k="apellido" class="mayus" required autocomplete="off" value="${esc(f.apellido)}"></label>
      <label class="f">Primer nombre<input data-k="nombre1" class="mayus" required autocomplete="off" value="${esc(f.nombre1)}"></label>

function leerAlta(){
  const a=ui.alta,v=id=>document.getElementById(id).value;
  const npl=v('t-planx');if(npl!==a.plan){a.plan=npl;a._re=1}
  a.titular={apellido:MAY(v('t-ape')).trim(),nombre1:MAY(v('t-n1')).trim(),nombre2:MAY(v('t-n2')).trim(),doc:v('t-doc').trim(),categoria:v('t-cat'),nac:v('t-nac')};a.telefono=v('t-tel');a.sinMail=document.getElementById('t-sinmail').checked;a.email=a.sinMail?'':v('t-mail');a.formaPago=v('t-pago');a.fechaAlta=v('t-alta');a.obs=v('t-obs');
  document.querySelectorAll('.fam-row').forEach(r=>{const f=a.familia[r.dataset.i];r.querySelectorAll('[data-k]').forEach(el=>f[el.dataset.k]=el.value.trim?el.value.trim():el.value)});
}
function yaAfiliado(a){ui.alta=null;toast(`${a.nombre} ya está en el padrón (afiliado N° ${a.nro}${a.estado!=='activo'?', dado de baja':''}). No hace falta darlo de alta.`);if(esAdmin()){ui.q=String(a.nro);ui.estado='';go('afiliados')}else go('inicio')}
function afterAlta(){
  const est=()=>{if(!ui.alta||!document.getElementById('t-ape'))return;leerAlta();const a=ui.alta;if(a._re){delete a._re;render();return}const tot=[a.titular,...a.familia].reduce((s,m)=>s+catPrecio(m.categoria,a.plan),0);document.getElementById('cuota-est').innerHTML=!tot?'Precio del plan a definir':a.promo?`${money(conPromo(tot,a.promo.pct))} <span class="muted" style="font-size:13px;font-weight:400">los primeros ${a.promo.meses===1?'mes':a.promo.meses+' meses'}, después ${money(tot)}</span>`:money(tot)};
  const f=document.getElementById('falta');f.oninput=est;f.onchange=est;est();
  const sm=document.getElementById('t-sinmail'),tm=document.getElementById('t-mail');if(sm)sm.addEventListener('change',()=>{tm.disabled=sm.checked;tm.required=!sm.checked;if(sm.checked)tm.value=''});
  const chequeo=(inp,esTitular)=>{const qd=docNorm(inp.value);const a=qd.length>=6&&S.afiliados.find(x=>docNorm(x.doc)===qd);if(!a||a.estado!=='activo')return;if(esTitular){yaAfiliado(a)}else{inp.setCustomValidity('Ya está afiliado');inp.reportValidity();toast(`${a.nombre} ya está afiliado (N° ${a.nro}). Quitalo del grupo o revisá el DNI.`)}};
  const td=document.getElementById('t-doc');td.addEventListener('change',()=>chequeo(td,true));
  f.addEventListener('change',e=>{if(e.target.matches('.fam-row [data-k=doc]'))chequeo(e.target,false)});f.addEventListener('input',e=>{if(e.target.matches('[data-k=doc]'))e.target.setCustomValidity('')});
  const ta=document.getElementById('t-ape');let prev=ta.value;ta.addEventListener('input',()=>{const nv=MAY(ta.value);document.querySelectorAll('.fam-row [data-k=apellido]').forEach(i=>{if(!i.value||i.value===prev)i.value=nv});prev=nv});
  f.onsubmit=e=>{e.preventDefault();leerAlta();const a=ui.alta;
    const nd=s=>{const d=String(s).replace(/\D/g,'');return d.length===11?d.slice(2,10).replace(/^0+/,''):d.replace(/^0+/,'')};
    const docs=[a.titular,...a.familia].map(m=>nd(m.doc)).filter(Boolean);
    if(new Set(docs).size!==docs.length){toast('Hay dos integrantes con el mismo DNI o CUIT. Revisalo antes de confirmar.');return}
    const rep=S.afiliados.find(x=>x.estado==='activo'&&docs.includes(nd(x.doc)));
    if(rep){yaAfiliado(rep);return}
    if(plan(a.plan).individual&&a.familia.length){toast(`El ${plan(a.plan).nombre} es individual. Quitá a los familiares o elegí otro plan.`);return}
    if(![a.titular,...a.familia].every(m=>catPrecio(m.categoria,a.plan)>0)){toast(`El ${plan(a.plan).nombre} todavía no tiene precio para todas las categorías. Un administrador lo carga en Configuración.`);return}
    const g=crearGrupo(S,{promo:a.promo||null,plan:a.plan,formaPago:a.formaPago,email:a.email,fechaAlta:a.fechaAlta,telefono:a.telefono,obs:a.obs},[{...a.titular},...a.familia]);
    if(g.promo)logCambio('Promoción',`${nombreCompleto(a.titular)} (N° ${g.nro}): ${promoTxt(g.promo)}, de ${perLabel(g.promo.desde)} a ${perLabel(g.promo.hasta)}`);
    ui.promo=null;save();ui.alta=null;ui.estado='activo';if(esAdmin()){ui.q=String(g.nro);go('afiliados')}else{ui.q='';go('inicio')}toast(`Alta registrada: ${nombreCompleto(a.titular)}${a.familia.length?` y ${a.familia.length} familiar(es)`:''}, afiliado N° ${g.nro}.`)};
}

 </div>
 <div class="grid2">${planesVista().filter(p=>BENEF.some(b=>benefDe(b,p.id))).map(p=>`<div class="panel"><h2 style="color:${p.id==='PLUS'?'var(--logo-red)':'var(--accent)'}">${esc(p.nombre)}</h2><p class="sub">${BENEF.filter(b=>benefDe(b,p.id)).length} ${BENEF.filter(b=>benefDe(b,p.id)).length===1?'beneficio':'beneficios'}. El detalle completo y el buscador están en Beneficios.</p>

V.caja=()=>{
  const per=ui.periodo,fin=finPeriodo(per);
  const aFacturar=per<INICIO.periodo?[]:S.grupos.filter(g=>cuotaGrupo(g,per)>0&&!S.facturas.some(f=>f.grupo===g.id&&f.periodo===per));

  const debPend=pend.filter(f=>grupo(f.grupo).formaPago==='Débito automático');
  const lr=S.lastRun;
  const pers=[...new Set(S.facturas.map(f=>f.periodo))].sort().reverse();
  const fl=S.facturas.filter(f=>!ui.filtroPer||f.periodo===ui.filtroPer).slice().reverse().slice(0,60);
  return head('Caja','Facturación de las cuotas del mes, débito automático y cobro en mostrador.')+

     <div>Grupos a facturar: <b class="num">${aFacturar.length}</b></div>

    if(usados[p.cod]===undefined){usados[p.cod]=a&&r.gratis?usadosGratis(a,p.cod,r):0;conDesc[p.cod]=a?usadosConDesc(a,p.cod):0}
    const gratisOk=aplica&&r.gratis&&dias>=r.carGratis;
    const disp=gratisOk?Math.max(0,r.gratis-usados[p.cod]):0,gratis=Math.min(cant,disp);usados[p.cod]+=gratis;
    let max=aplica?pctPorAntig(r,dias):0;const pagas=cant-gratis;
    let topeTxt='';if(max&&r.maxDesc){const libres=Math.max(0,r.maxDesc-conDesc[p.cod]);if(libres<pagas){topeTxt=`tope de ${r.maxDesc} con descuento por año alcanzado`;if(!libres)max=0}}
    const pct=!max||!pagas?0:r.modo==='hasta'?Math.min(max,Math.max(0,parseFloat(String(i.pct??max).replace(',','.'))||0)):max;
    const conPct=r.maxDesc?Math.min(pagas,Math.max(0,r.maxDesc-conDesc[p.cod])):pagas;if(pct)conDesc[p.cod]+=conPct;
    const lista=pu*cant,desc=pu*gratis+Math.round(pu*conPct*pct)/100;

    if(!a){}else if(!aplica)notas.push('Sin beneficio');
    else{if(r.gratis){notas.push(dias<r.carGratis?`Sin cargo desde el ${fd(addDays(a.fechaAlta,r.carGratis))}`:`${gratis?gratis+' sin cargo':'Sin cargo agotado'} (usadas ${usados[p.cod]} de ${r.gratis} ${VENT_TXT[r.per||'anio']}${r.porGrupo?' en el grupo':''})`)}
      if(pct&&pagas)notas.push(`${pct}% de descuento`);else if(pagas&&(r.desc||escalaDe(r).length)&&!max&&!topeTxt)notas.push(`Descuento desde el ${fd(addDays(a.fechaAlta,r.car||0))}`);
      if(topeTxt)notas.push(topeTxt);if(!notas.length)notas.push('Sin beneficio para esta prestación')}

  return {motivos,aplica,pl,lineas,lista:t('lista'),desc:t('desc'),total:t('total')};
}

function alertasCambio(A,B){const al=[];const num=v=>typeof v==='number'?v:null;
  const cmp=(ruta,a,b)=>{if(a===b)return;if(a&&typeof a==='object'&&b&&typeof b==='object'){new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>cmp(ruta+'.'+k,a[k],b[k]));return}
    const x=num(a),y=num(b);if(x===null&&y===null)return;
    if(/\.precios?\b|\.precio$/.test(ruta)&&x&&y!==null&&Math.abs(y-x)/x>0.5)al.push(`Un precio cambia más de 50% (${money(x)} → ${money(y)}).`);
    if(/\.precios?\b|\.precio$/.test(ruta)&&x&&!y)al.push(`Un precio pasa de ${money(x)} a $0.`);
    if(/\.gratis$/.test(ruta)&&y!==null&&(y>10||(x!==null&&Math.abs(y-x)>=3)))al.push(`Sesiones sin cargo: ${x??0} → ${y}.`);
    if(/\.desc$/.test(ruta)&&y!==null&&y>60)al.push(`Descuento de ${y}% (más de 60%).`);
    if(/\.(car|carGratis)$/.test(ruta)&&y!==null&&(y>365||(x&&!y)))al.push(`Carencia: ${x??0} → ${y} días.`)};
  CONF_SECC.forEach(k=>cmp(k,A[k],B[k]));return [...new Set(al)]}

  const al=alertasCambio(A,B),items=cambios.flatMap(c=>c.detalle.split('; ').map(d=>({a:c.accion,d})));
  modal(`<form id="fconf" class="modal" role="dialog" aria-modal="true" aria-label="Confirmar cambios" style="width:min(640px,100%)"><h2>Confirmá los cambios</h2>
   <p style="margin:0">Se van a modificar <b>${items.length}</b> ${items.length===1?'dato':'datos'}. Revisalos antes de guardar:</p>
   <div style="max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px">${items.map(x=>`<div style="padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px"><span class="muted">${esc(x.a)} ·</span> ${esc(x.d).replace(/→/g,'<b style="color:var(--accent)">→</b>')}</div>`).join('')}</div>
   ${al.length?`<div class="verdict bad" style="font-size:14px"><b>Atención, revisá esto:</b><br>${al.map(esc).join('<br>')}</div>`:''}
   <label class="f">Tu clave, para confirmar<input id="conf-pw" type="password" required autocomplete="current-password"></label>
   <p id="conf-err" class="muted" style="margin:0;color:var(--bad)"></p>
   <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="modal-no">Cancelar <kbd>Esc</kbd></button><button class="btn primary" type="submit">Sí, guardar los cambios</button></div></form>`);

function enLetras(n){const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'],
  D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'],C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const c999=x=>{if(x===0)return '';if(x===100)return 'cien';const c=Math.floor(x/100),r=x%100;let t=C[c];if(r){t+=(t?' ':'')+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?' y '+U[r%10]:''))}return t};
  const ent=Math.floor(n),cent=Math.round((n-ent)*100);let t='';const mill=Math.floor(ent/1e6),mil=Math.floor(ent%1e6/1000),r=ent%1000;
  if(mill)t+=(mill===1?'un millón':c999(mill).replace(/veintiuno$/,'veintiún').replace(/uno$/,'un')+' millones')+' ';if(mil)t+=(mil===1?'mil':c999(mil).replace(/veintiuno$/,'veintiún').replace(/uno$/,'un')+' mil')+' ';if(r)t+=c999(r);t=t.trim()||'cero';

function nombresPadron(){const n=new Set();S.afiliados.forEach(a=>{const p=partirNombre(a);[p.nombre1,p.nombre2].forEach(x=>x&&n.add(norm(x)))});return n}
function partirInteresado(txt){const w=MAY(txt).trim().split(/\s+/).filter(Boolean);if(!w.length)return null;const NP=nombresPadron(),esNom=x=>NOMBRES_AR.has(norm(x))||NP.has(norm(x));
  if(w.length===1)return esNom(w[0])?{apellido:'',nombres:w}:{apellido:w[0],nombres:[]};
  if(esNom(w[0])&&!esNom(w[w.length-1]))return {apellido:w[w.length-1],nombres:w.slice(0,-1)};
  return {apellido:w[0],nombres:w.slice(1)}}

const LIBS={jspdf:'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',autotable:'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js',pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'};
const cargarScript=url=>new Promise((ok,mal)=>{if(document.querySelector(`script[src="${url}"]`)){ok();return}const x=document.createElement('script');x.src=url;x.onload=ok;x.onerror=()=>mal(new Error('No se pudo cargar '+url));document.head.appendChild(x)});
async function lineasPdf(buf){await cargarScript(LIBS.pdf);const L=window.pdfjsLib;L.GlobalWorkerOptions.workerSrc=LIBS.pdfw;
  const doc=await L.getDocument({data:buf}).promise,out=[];
  for(let n=1;n<=doc.numPages;n++){const pg=await doc.getPage(n),tc=await pg.getTextContent(),filas=[];
    tc.items.filter(i=>i.str&&i.str.trim()).forEach(i=>{const y=i.transform[5],x=i.transform[4];let f=filas.find(r=>Math.abs(r.y-y)<3.5);if(!f){f={y,it:[]};filas.push(f)}f.it.push({x,t:i.str})});
    filas.sort((a,b)=>b.y-a.y).forEach(f=>out.push(f.it.sort((a,b)=>a.x-b.x).map(i=>i.t).join('  ').replace(/\s+/g,' ').trim()))}
  return out}
async function lineasPlanilla(buf){await cargarScript(LIBS.xlsx);const wb=XLSX.read(buf,{type:'array'}),out=[];
  (wb.SheetNames.filter(n=>/nomenclador|precio|lista/i.test(n)).length?wb.SheetNames.filter(n=>/nomenclador|precio|lista/i.test(n)):wb.SheetNames).forEach(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true}).forEach(r=>{const t=r.filter(c=>c!==null&&c!==undefined&&String(c).trim()!=='').map(c=>typeof c==='number'?(Number.isInteger(c)?String(c).replace(/\B(?=(\d{3})+(?!\d))/g,'.'):c.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d),)/g,'.')):String(c)).join('  ');if(t.trim())out.push(t)}));return out}
function leerRenglon(t){const montos=[];const re=/(\$\s*)?(\d{1,3}(?:[.\s]\d{3})+|\d+)(,\d{1,2})?(\s*%)?/g;let m,primero=-1;
  while((m=re.exec(t))){if(m[4])continue;const v=Number(m[2].replace(/[.\s]/g,'')+(m[3]?'.'+m[3].slice(1):''));if(!(v>=100)&&!m[1])continue;if(!m[1]&&!m[3]&&/^\d{4}$/.test(m[2])&&v>=1900&&v<=2100)continue;if(!(v>=1))continue;
    if(/\d{2}\/\d{2}/.test(t.slice(Math.max(0,m.index-3),m.index+m[0].length+3)))continue;montos.push(v);if(primero<0)primero=m.index}
  if(!montos.length)return null;
  let nom=t.slice(0,primero).replace(/[\$:.·\-–|]+\s*$/,'').replace(/^\s*(\d+[\.\)\-]?|[A-Z]{1,3}\d{1,4}|[•\-–*])\s+/,'').trim();
  if(!/[a-záéíóúñ]{3}/i.test(nom)||/^(sub)?total|^precio|^importe|^p[aá]gina/i.test(nom))return null;return {nombre:nom,montos,txt:t}}
const PAL_VACIAS=new Set('de del la las el los en con y por a o al para sin un una'.split(' '));
const toksImp=t=>norm(t).replace(/[^a-z0-9ñ ]/g,' ').split(/\s+/).filter(x=>x.length>1&&!PAL_VACIAS.has(x));
function parecido(a,b){const A=toksImp(a),B=toksImp(b);if(!A.length||!B.length)return 0;const na=A.join(' '),nb=B.join(' ');if(na===nb)return 1;if(na.includes(nb)||nb.includes(na))return .85;
  const sb=new Set(B);let c=0;A.forEach(x=>{if(sb.has(x)||[...sb].some(y=>y.length>4&&x.length>4&&(y.startsWith(x.slice(0,5))||x.startsWith(y.slice(0,5)))))c++});return 2*c/(A.length+B.length)}
function armarImport(){const im=ui.imp,col=im.col;
  const filas=im.reng.map(r=>({nombre:r.nombre,monto:r.montos[Math.min(col,r.montos.length-1)],uni:UNIDADES.find(u=>norm(r.txt||'').includes(norm(u)))}));

    else{const p=prest(f.dest);if(!p)return;if(p.activo===false){p.activo=true;cam.push(`${p.nombre}: vuelve a usarse`)}if(p.precio!==f.precio){cam.push(`${p.nombre}: ${money(p.precio)} → ${money(f.precio)}`);p.precio=f.precio;precios++;p.act={fecha:TODAY,por:yo?yo.nombre:''}}}});

function buscarUnidad(q){const t=String(q||'').trim();if(!t)return null;if(/N°\s*\d+\s*$/.test(t))return buscarAfiliado(t);
  if(/[a-zñáéíóúü]/i.test(t)){const toks=norm(t).split(/\s+/).filter(Boolean),ms=S.afiliados.filter(a=>toks.every(k=>norm(a.nombre).split(/\s+/).some(w=>w.startsWith(k))));return ms.length===1?ms[0]:ms.length?{varios:ms.length}:null}
  const d=t.replace(/\D/g,'');if(d.length===11){const dn=d.slice(2,10).replace(/^0+/,'');return S.afiliados.find(x=>docNorm(x.doc)===d||docNorm(x.doc)===dn)||null}
  return S.afiliados.find(x=>String(x.nro)===d)||(d.length>=6?S.afiliados.find(x=>docNorm(x.doc)===docNorm(d)):null)}
function estadoUnidad(q){const t=String(q||'').trim();if(!t)return null;

function ahorroDe(ids,desde,hasta){const det={};let total=0,sinValor=0;
  S.factPrest.filter(f=>ids.includes(f.afiliado)&&f.fecha>=desde&&f.fecha<=hasta).forEach(f=>f.lineas.forEach(l=>{const m=ahorroLinea(l),k=l.nombre;(det[k]=det[k]||{nombre:k,veces:0,sc:0,monto:0});det[k].veces+=l.cant;det[k].sc+=l.gratis||0;det[k].monto+=m;total+=m;if(!m&&(l.gratis||l.descPct))sinValor++}));

  return {total,det:Object.values(det).sort((a,b)=>b.monto-a.monto),sinValor}}

      <label class="f">Factura a nombre de (condición IVA)<select data-bs="no" name="fcond">${Object.entries(COND_IVA).map(([k,t])=>`<option value="${k}" ${fiscalDe(g).cond===k?'selected':''}>${t}</option>`).join('')}</select></label>
      <label class="f">CUIT para facturar<input name="fcuit" class="docfmt" value="${esc(fiscalDe(g).cuit)}" placeholder="Solo si no es consumidor final"></label>
      <label class="f">Razón social<input name="frazon" class="mayus" value="${esc(fiscalDe(g).razon)}" placeholder="Solo si no es consumidor final"></label>`:''}
     </div>
     <label class="f">Observaciones<input name="obs" value="${esc(a.obs)}"></label>
     <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="edit-no" data-a="${a.id}">Cancelar <kbd>Esc</kbd></button><button class="btn primary" type="submit">Guardar cambios</button></div>
    </form>`:`<div class="panel"><dl class="kv">
    <dt>CUIT/DNI</dt><dd class="num">${esc(a.doc)}</dd>
    <dt>Plan</dt><dd>${esc(plan(g.plan).nombre)}</dd>
    <dt>Categoría</dt><dd>${esc(cat(a.categoria).nombre)}</dd>
    <dt>Cuota mensual</dt><dd class="num">${money(a.cuota)}</dd>
    <dt>Nacimiento</dt><dd>${a.nac?`${fd(a.nac)} · ${edad(a.nac)} años${esCumple(a)?' 🎂 <b>¡Hoy cumple años!</b>':''}`:'<span class="muted">Sin cargar</span>'}</dd>
    <dt>Fecha de alta</dt><dd>${fd(a.fechaAlta)}</dd>
    <dt>Teléfono</dt><dd>${esc(a.telefono)||'<span class="muted">Sin cargar</span>'}</dd>
    <dt>Paga</dt><dd>${t.id===a.id?'Titular del grupo':esc(t.nombre)} · ${esc(g.formaPago)}</dd><dt>Factura</dt><dd>${letraDe(g)} · ${esc(COND_IVA[fiscalDe(g).cond])}${fiscalDe(g).cuit?' · CUIT '+esc(fiscalDe(g).cuit):''}${fiscalDe(g).razon?' · '+esc(fiscalDe(g).razon):''}</dd>
    ${g.email&&t.id===a.id?`<dt>Email</dt><dd>${esc(g.email)}</dd>`:''}
    ${a.obs?`<dt>Observaciones</dt><dd>${esc(a.obs)}</dd>`:''}
    ${a.estado!=='activo'?`<dt>Baja</dt><dd>${fd(a.fechaBaja)}</dd>`:''}
   </dl><div class="row" style="margin-top:14px"><button class="btn small" type="button" data-act="edit" data-a="${a.id}">Editar datos</button></div></div>`;
  L.innerHTML=`<div class="overlay" data-close><div class="drawer" role="dialog" aria-modal="true" aria-label="Ficha de ${esc(a.nombre)}">
   <div class="row" style="justify-content:space-between;align-items:flex-start"><div><span class="mono">Afiliado N° ${a.nro}</span><h2>${esc(a.nombre)}</h2></div><button class="btn small" type="button" data-close>Cerrar</button></div>
   <div class="row">${a.estado==='activo'?chipCuenta(g.id):chipEstado(a)}</div>
   ${datos}
   ${(()=>{const us=S.usosComercio.filter(x=>x.afiliado===a.id).slice().reverse();return us.length?`<div class="panel"><h2>Consumos en comercios adheridos</h2><div class="tbl-wrap"><table><tbody>${us.slice(0,15).map(x=>`<tr><td class="num nw">${fd(x.fecha)}</td><td>${esc(x.comercio)}<div class="muted" style="font-size:12px">${esc(x.detalle||'')}</div></td><td class="r num">${x.importe?money(x.total):''}${x.ahorro?`<div class="muted" style="font-size:12px">ahorró ${money(x.ahorro)}</div>`:''}</td></tr>`).join('')}</tbody></table></div></div>`:''})()}
   <div class="panel"><h2>Beneficios usados</h2><p class="sub">Año ${TODAY.slice(0,4)}, según el ${esc(plan(g.plan).nombre)}.</p>${htmlBeneficios(a,false)}</div>
   <div class="panel"><h2>Grupo de pago</h2><p class="sub">Cuota mensual del grupo ${money(cuotaGrupo(g))} · saldo ${money(ct.saldo)}${g.promo?` · promoción ${g.promo.pct}% de ${perLabel(g.promo.desde)} a ${perLabel(g.promo.hasta)}${g.promo.hasta<TODAY.slice(0,7)?' (terminada)':''}`:''}${g.email?` · email ${esc(g.email)}`:' · <span style="color:var(--warn)">sin email</span>'}</p>
    ${esAdmin()?`<div class="row" style="margin-bottom:8px"><button class="btn small" type="button" data-act="promo-grupo" data-g="${g.id}">${g.promo?'Renovar, extender o quitar promoción':'Agregar promoción'}</button></div>`:''}
    <div class="tbl-wrap"><table><tbody>${miembros(g).map(m=>`<tr ${m.id!==a.id?`data-ficha="${m.id}" style="cursor:pointer"`:''}><td class="mono">${m.nro}</td><td>${m.id===a.id?'<b>'+esc(m.nombre)+'</b>':esc(m.nombre)}${m.estado!=='activo'?' <span class="chip neu">Baja</span>':''}</td><td>${esc(cat(m.categoria).nombre)}</td><td class="r num">${money(m.estado==='activo'?m.cuota:0)}</td></tr>`).join('')}</tbody></table></div></div>
   <div class="row">
    <button class="btn" type="button" data-act="ver-cta" data-g="${g.id}">Ver cuenta corriente</button>
    ${!esAdmin()?'':a.estado==='activo'?`<button class="btn danger" type="button" data-act="baja-1" data-a="${a.id}">Dar de baja</button>`:`<button class="btn" type="button" data-act="reactivar" data-a="${a.id}">Reactivar</button>`}
   </div>
   <div id="baja-conf"></div>
  </div></div>`;
  const fe=document.getElementById('fedit');
  bindMontos(L);formatoCampos(L);buscadores(L);
  if(fe){fe.querySelector('input').focus();fe.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(fe));
    const partes={apellido:MAY(d.apellido).trim(),nombre1:MAY(d.nombre1).trim(),nombre2:MAY(d.nombre2).trim()};
    const nuevo={nombre:nombreCompleto(partes),doc:fmtDoc(d.doc)||d.doc.trim(),categoria:d.categoria,cuota:parseMonto(d.cuota),telefono:d.telefono.trim(),fechaAlta:d.fechaAlta||a.fechaAlta,nac:d.nac||'',obs:d.obs.trim()};
    const aplicar=()=>{const etiq={nombre:'nombre',doc:'CUIT/DNI',categoria:'categoría',cuota:'cuota',telefono:'teléfono',fechaAlta:'fecha de alta',nac:'fecha de nacimiento',obs:'observaciones'};
      const cambios=Object.keys(nuevo).filter(k=>String(nuevo[k])!==String(a[k])).map(k=>`${etiq[k]}: ${k==='cuota'?money(a[k]):k==='categoria'?cat(a[k]).nombre:(a[k]||'—')} → ${k==='cuota'?money(nuevo[k]):k==='categoria'?cat(nuevo[k]).nombre:(nuevo[k]||'—')}`);
      if(d.plan&&d.plan!==g.plan){cambios.push(`plan del grupo: ${plan(g.plan).nombre} → ${plan(d.plan).nombre}`);const viejo=g.plan;g.plan=d.plan;
        miembros(g).forEach(m=>{if(m.id===a.id)return;const nv=catPrecio(m.categoria,d.plan);if(nv&&m.cuota===catPrecio(m.categoria,viejo)){m.cuota=nv}})}
      if('formaPago' in d){if(g.formaPago!==d.formaPago)cambios.push(`forma de pago: ${g.formaPago} → ${d.formaPago}`);if(g.email!==d.email.trim())cambios.push(`email: ${g.email||'—'} → ${d.email.trim()||'—'}`);g.formaPago=d.formaPago;g.email=d.email.trim();
        const fz=fiscalDe(g),nf={cond:d.fcond||'CF',cuit:(d.fcuit||'').trim(),razon:MAY(d.frazon||'').trim()};if(nf.cond!==fz.cond||nf.cuit!==fz.cuit||nf.razon!==fz.razon){cambios.push(`facturar a: ${COND_IVA[fz.cond]}${fz.cuit?' '+fz.cuit:''} → ${COND_IVA[nf.cond]}${nf.cuit?' '+nf.cuit:''}${nf.razon?' ('+nf.razon+')':''}`);g.fiscal=nf}}
      Object.assign(a,nuevo,partes);if(cambios.length)logCambio('Modificación',`${a.nombre} (N° ${a.nro}): ${cambios.join('; ')}`);
      autorizo=null;autEdicion=null;save();render();ficha(a.id);toast(cambios.length?'Datos actualizados.':'No hubo cambios.')};
    if(autEdicion){autorizo=autEdicion;aplicar()}else if(nuevo.cuota!==a.cuota||(d.plan&&d.plan!==g.plan))pedirAdmin('montos',aplicar);else aplicar()};
    const upd=()=>{const c=fe.querySelector('[name=cuota]'),pl=fe.querySelector('[name=plan]')?.value||g.plan,v=catPrecio(fe.querySelector('[name=categoria]').value,pl);if(!c.readOnly&&v)c.value=fmtNum(v)};
    fe.querySelector('[name=categoria]').onchange=upd;const sp=fe.querySelector('[name=plan]');if(sp)sp.onchange=upd;}
  else L.querySelector('.btn[data-close]').focus();
}
function cerrarFicha(){document.getElementById('layer').innerHTML='';autEdicion=null}

/* ---------- acciones ---------- */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-view]');if(nav){e.preventDefault();cerrarFicha();go(nav.dataset.view);return}
  const fm=e.target.closest('[data-ficha]');if(fm){ficha(fm.dataset.ficha);return}
  if(e.target.matches('[data-close-modal]')){cerrarModal();return}
  if(e.target.matches('[data-close]')){cerrarFicha();return}
  const row=e.target.closest('tr[data-open]');if(row){ficha(row.dataset.open);return}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(CONF_ACTS.includes(act)&&!b.dataset.ok&&!DRY){confirmarConfig(b);return}
  if(act==='nueva-alta'){ui.alta=nuevaAlta();go('altas')}
  if(act==='cot-add'){ui.cot.push('HIJ');render()}
  if(act==='cot-del'){ui.cot.splice(b.dataset.i,1);render()}
  if(act==='cancelar-alta'){ui.alta=null;render()}
  if(act==='add-fam'){leerAlta();ui.alta.familia.push({apellido:ui.alta.titular.apellido,nombre1:'',nombre2:'',doc:'',categoria:'HIJ'});render();const r=[...document.querySelectorAll('.fam-row')].pop();r?.querySelector(r.querySelector('[data-k=apellido]').value?'[data-k=nombre1]':'[data-k=apellido]')?.focus()}
  if(act==='del-fam'){leerAlta();ui.alta.familia.splice(b.dataset.i,1);render()}
  if(act==='cot-iniciar'){
    const [t,...resto]=ui.cot;const tcat=['TIT','TIT64'].includes(t)?t:'TIT';
    ui.alta=nuevaAlta(plan(b.dataset.plan||'PLUS').individual?[]:(['TIT','TIT64'].includes(t)?resto:ui.cot).map(c=>({apellido:'',nombre1:'',nombre2:'',doc:'',categoria:c})),tcat,b.dataset.plan||'PLUS');ui.alta.promo=ui.promo||null;
    go('altas');toast('Completá los datos de cada integrante.')}
  if(act==='guardar-precios')pedirAdmin('montos',()=>{
    const aplicar=document.getElementById('aplicar-act').checked;let n=0;const cam=[];
    document.querySelectorAll('[data-precio]').forEach(i=>{const [pid,cid]=i.dataset.precio.split(':'),p=plan(pid),c=cat(cid),viejo=catPrecio(cid,pid),v=parseMonto(i.value);if(v!==viejo){
      cam.push(`${p.nombre}, ${c.nombre}: ${money(viejo)} → ${money(v)}`);
      if(aplicar&&v>0)S.afiliados.forEach(a=>{if(grupo(a.grupo).plan===pid&&a.categoria===cid&&a.cuota===viejo){a.cuota=v;n++}});p.precios[cid]=v;if(pid==='PLUS')c.precio=v}});
    document.querySelectorAll('[data-ivapl]').forEach(i=>{const p=plan(i.dataset.ivapl),nv=ivaNum(i.value),vj=ivaNum(p.iva);if(nv!==vj){cam.push(`${p.nombre}: IVA ${ivaTxt(vj)} → ${ivaTxt(nv)}`);p.iva=i.value}});
    if(cam.length)logCambio('Precios',cam.join('; ')+(aplicar?` (se actualizaron ${n} cuotas)`:''));
    save();render();toast(!cam.length?'No hubo cambios de precios.':aplicar?`Precios guardados. Se actualizaron ${n} cuota(s).`:'Precios guardados para las próximas altas.')});
  if(act==='guardar-permisos')pedirAdmin('_',()=>{const cam=[];document.querySelectorAll('[data-perm]').forEach(i=>{if(S.admin.permisos[i.dataset.perm]!==i.checked){cam.push(`${PERMISOS[i.dataset.perm]}: ${i.checked?'requiere administrador':'libre'}`);S.admin.permisos[i.dataset.perm]=i.checked}});
    if(cam.length)logCambio('Permisos',cam.join('; '));save();render();toast(cam.length?'Permisos guardados.':'No hubo cambios.')});
  if(act==='guardar-pv')pedirAdmin('_',()=>{const cam=[],pv=Object.assign({},S.config.pv||{}),ul=Object.assign({},S.config.pvUlt||{});
    document.querySelectorAll('[data-pvn]').forEach(i=>{const k=i.dataset.pvn,v=Math.max(1,parseInt(i.value)||PV_DEF[k]);if(v!==pvDe(k))cam.push(`${PV_NOM[k]}: punto de venta ${pvDe(k)} → ${v}`);pv[k]=v});
    document.querySelectorAll('[data-pvu]').forEach(i=>{const k=i.dataset.pvu,v=Math.max(0,parseInt(i.value)||0);if(v!==(+ul[k]||0))cam.push(`${PV_NOM[k]}: último N° ${+ul[k]||0} → ${v}`);ul[k]=v});
    const ua=Object.assign({},S.config.pvUltA||{});document.querySelectorAll('[data-pvua]').forEach(i=>{const k=i.dataset.pvua,v=Math.max(0,parseInt(i.value)||0);if(v!==(+ua[k]||0))cam.push(`${PV_NOM[k]}: último N° Factura A ${+ua[k]||0} → ${v}`);ua[k]=v});S.config.pvUltA=ua;
    const vals=[];if(new Set(vals).size!==vals.length){toast('Hay dos unidades con el mismo punto de venta: cada una tiene que tener el suyo.');return}
    S.config.pv=pv;S.config.pvUlt=ul;if(cam.length)logCambio('Puntos de venta',cam.join('; '));save();render();toast(cam.length?'Puntos de venta guardados.':'No hubo cambios.')});
  if(act==='guardar-cfg')pedirAdmin('_',()=>{const cam=[];const v=Math.min(28,Math.max(1,parseInt(document.getElementById('cfg-vto').value)||10));
    if(v!==S.config.diaVto){cam.push(`día de vencimiento: ${S.config.diaVto} → ${v}`);S.config.diaVto=v}
    document.querySelectorAll('[data-car]').forEach(i=>{const k=i.dataset.car,n=Math.max(0,parseInt(i.value)||0);if(n!==S.plan.car[k]){cam.push(`carencia ${TIPOS[k].toLowerCase()}: ${S.plan.car[k]} → ${n} días`);S.plan.car[k]=n}});
    if(cam.length)logCambio('Configuración',cam.join('; '));save();render();toast(cam.length?'Configuración guardada.':'No hubo cambios.')});
  if(act==='wa-afi'){const a=afiliado(b.dataset.a),t=titular(grupo(a.grupo));modalWa(textoAfiliado(a),a.telefono||t.telefono||'',{titulo:'sus beneficios',info:()=>infoAfi(a),nombre:nomPdf('Mis beneficios',a.nombre),msg:`Hola ${nomPila(a)} 👋 Te enviamos el detalle de tus beneficios en Integral del Este: lo que tenés disponible y lo que ya usaste.`})}
  if(act==='at-tipo'){const at=atEstado();at.tipo=b.dataset.t;render()}
  if(act==='at-canal-x'){atEstado().canal=b.dataset.c;document.querySelectorAll('[data-act="at-canal"]').forEach(x=>{const on=x.dataset.c===b.dataset.c;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)})}
  if(act==='at-regen'){const at=atEstado();at.editado=false;at.txt=null;render()}
  if(act==='at-copiar'){const t=document.getElementById('at-txt').value;(navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>toast('Mensaje copiado.'),()=>{const x=document.getElementById('at-txt');x.select();try{document.execCommand('copy');toast('Mensaje copiado.')}catch(e){toast('No se pudo copiar; seleccioná el texto y copialo.')}})}
  if(act==='at-imprimir'){const t=document.getElementById('at-txt').value.replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/_([^_\n]+)_/g,'<i>$1</i>');const w=window.open('','_blank');
    if(w){w.document.write(`<!doctype html><meta charset="utf-8"><title>Integral del Este</title><body style="font-family:system-ui,sans-serif;max-width:680px;margin:30px auto;line-height:1.5;white-space:pre-wrap;font-size:15px">${t}</body>`);w.document.close();w.focus();w.print();atRegistrar('Impreso')}else toast('El navegador bloqueó la ventana de impresión.')}
  if(act==='at-registrar'){atRegistrar('Sin enviar')}
  if(act==='wa-aho'){const g=grupo(b.dataset.g),t=titular(g);modalWa(textoAhorro(g,ui.ahoP||'anio'),t.telefono||'',{titulo:'el resumen de ahorro',info:()=>infoAhorro(g,ui.ahoP||'anio'),nombre:nomPdf('Tu ahorro',t.nombre),msg:`Hola ${nomPila(t)} 👋 Te contamos cuánto ahorraste gracias a Integral del Este.`})}
  if(act==='eg-fijo'){ui.egPre=S.egresos.find(e=>e.id===b.dataset.e);render()}
  if(act==='eg-del'){const e=S.egresos.find(x=>x.id===b.dataset.e);pedirAdmin('_',()=>{S.egresos=S.egresos.filter(x=>x!==e);logCambio('Egresos',`Se borró: ${catEgr(e.cat)[1]} · ${e.proveedor} · ${money(e.importe)} (${fd(e.fecha)})`);save();render();toast('Egreso borrado.')})}
  if(act==='inf-xlsx'){informeExcel(ui.infT||'caja').catch(e=>{console.error(e);toast('No se pudo armar el Excel.')})}
  if(act==='inf-pdf'){informePdf(ui.infT||'caja').catch(e=>{console.error(e);toast('No se pudo armar el PDF.')})}
  if(act==='undo-cfg'){deshacerConfig(b.dataset.u)}
  if(act==='undo-ok'){aplicarDeshacer(b.dataset.u)}
  if(act==='ver-bajas'){ui.verBajas=!ui.verBajas;render()}
  if(act==='un-edit'){modalUnidad(b.dataset.un)}
  if(act==='bk-bajar'){bajarCopia().catch(e=>{console.error(e);toast('No se pudo descargar la copia.')})}
  if(act==='bk-subir'){const fi=document.getElementById('bk-file');fi.value='';fi.onchange=()=>{if(fi.files[0])subirCopia(fi.files[0])};fi.click()}
  if(act==='ver-rec'){verRecibo(S.recibos.find(x=>x.id===b.dataset.r))}
  if(act==='wa-rec'){const r=S.recibos.find(x=>x.id===b.dataset.r),t=titular(grupo(r.grupo));modalWa(textoRecibo(r),t.telefono||'')}

});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!yo)return;
    if(e.target.type==='search'&&e.target.value)return;

    if(hayModal()){cerrarModal();return}

});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.some(x=>x[0]===v)&&v!==view){view=v;render()}});
try{sessionStorage.removeItem(SES)}catch(e){}
mostrarLogin();
